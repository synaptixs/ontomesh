# nginx reverse proxy — Ontology Toolkit API Gateway
# TMF URL patterns: /{apiRoot}/{version}/{resource}/{id}

upstream toolkit  { server toolkit:5000; }
upstream oxigraph { server oxigraph:7878; }
upstream shacl    { server shacl:5001; }

server {
    listen 80;
    server_name localhost;

    # ── Browser Wizard ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://toolkit;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # ── TMF Open API patterns ─────────────────────────────────────────────
    # TMF620 Product Catalog
    location ~ ^/productCatalogManagement/ {
        proxy_pass http://toolkit;
        proxy_set_header Host $host;
    }

    # TMF632 Party Management
    location ~ ^/partyManagement/ {
        proxy_pass http://toolkit;
        proxy_set_header Host $host;
    }

    # TMF639 Resource Inventory
    location ~ ^/resourceInventoryManagement/ {
        proxy_pass http://toolkit;
        proxy_set_header Host $host;
    }

    # TMF641 Service Ordering
    location ~ ^/serviceOrderingManagement/ {
        proxy_pass http://toolkit;
        proxy_set_header Host $host;
    }

    # TMF642 Alarm Management
    location ~ ^/alarmManagement/ {
        proxy_pass http://toolkit;
        proxy_set_header Host $host;
    }

    # ── SPARQL Endpoint ───────────────────────────────────────────────────
    location /sparql {
        proxy_pass         http://oxigraph/query;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /sparql/update {
        proxy_pass         http://oxigraph/update;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SHACL Validation ──────────────────────────────────────────────────
    location /validate {
        proxy_pass         http://shacl/validate;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Health ────────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://toolkit/health;
    }
}
