# Ontomesh — Google Cloud Run service config (P2.4).
#
# Cloud Run is the simplest GCP target for the wizard: it's billed by
# request-second, scales to zero, and supports SSE (streaming HTTP).
# The catch is that Cloud Run instances are stateless — SQLite on a
# local volume doesn't persist across cold starts.  For Cloud Run you
# almost always want to pair this with Cloud SQL Postgres and set
# ONTOMESH_DB_URL to the connection string.
#
# Build + push the image (once):
#   gcloud auth login
#   gcloud config set project YOUR_PROJECT_ID
#   gcloud builds submit --tag gcr.io/YOUR_PROJECT_ID/ontomesh:3.6.0-dev
#
# Deploy (applies this manifest):
#   gcloud run services replace deploy/cloudrun.yaml --region us-central1
#
# Get the public URL:
#   gcloud run services describe ontoforge --region us-central1 \
#     --format="value(status.url)"
#
# Cloud SQL Postgres pairing (recommended for production):
#   gcloud sql instances create ontomesh-db --database-version=POSTGRES_16 ...
#   gcloud sql databases create ontoforge --instance=ontomesh-db
#   # then update the env block below with the connection string:
#   #   ONTOMESH_DB_URL=postgresql://user:pass@/dbname?host=/cloudsql/INSTANCE_CONNECTION_NAME

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ontomesh
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/launch-stage: GA
    # SSE: tell Cloud Run we want HTTP/1.1 + no buffering.
    run.googleapis.com/sessionAffinity: "true"
spec:
  template:
    metadata:
      annotations:
        # Scale to zero is the default; bump min-scale=1 for always-on.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # CPU is throttled when no requests are in-flight — fine for
        # the wizard.  Set to "always-allocated" if you depend on
        # background work.
        run.googleapis.com/cpu-throttling: "true"
        # Cloud SQL socket (only set when ONTOMESH_DB_URL points at pg):
        # run.googleapis.com/cloudsql-instances: "PROJECT:REGION:INSTANCE"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300                  # SSE keep-alive headroom
      containers:
      - image: gcr.io/YOUR_PROJECT_ID/ontomesh:3.6.0-dev
        ports:
        - name: http1
          containerPort: 5051
        env:
        - name: ONTOMESH_HOST
          value: "0.0.0.0"
        - name: ONTOMESH_PORT
          value: "5051"
        - name: ONTOMESH_DATA_DIR
          value: "/tmp/ontomesh"           # ephemeral — pair with Cloud SQL
        # - name: ONTOMESH_DB_URL
        #   valueFrom:
        #     secretKeyRef:
        #       name: ontomesh-db-url
        #       key: latest
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
        # P3.3 — Cheap liveness (process alive) on /live.  Cloud
        # Run doesn't expose a readiness probe directly; the gates
        # are "container started" + "liveness passes" + every
        # request returns 2xx within timeoutSeconds.  For deeper
        # readiness checks, monitor /ready from Cloud Monitoring.
        startupProbe:
          httpGet:
            path: /live
            port: 5051
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6                  # 30 s grace
        livenessProbe:
          httpGet:
            path: /live
            port: 5051
          periodSeconds: 30
          timeoutSeconds: 5
  traffic:
  - percent: 100
    latestRevision: true
