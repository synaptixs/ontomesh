<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60"
     role="img" aria-label="Ontomesh">
  <title>Ontomesh</title>
  <!-- Light-inked "fib" monogram + green golden (Fibonacci) spiral, recoloured
       from the navy+green brand mark to read on the navy docs header. -->

  <!-- Green golden spiral — the "b"/"6" bowl, a near-closed loop winding
       inward to the centre. -->
  <path d="M27 19
           A 19 19 0 1 1 12 39
           A 11 11 0 0 1 35 33
           A 6 6 0 0 1 29 35
           A 3 3 0 0 1 32 33"
        fill="none" stroke="#8fd14f" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Light "f": tall stem rising into a top hook, with a crossbar. -->
  <path d="M23 50 V17 a8 8 0 0 1 8 -8"
        fill="none" stroke="#e6ecf5" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="15" y1="22" x2="31" y2="22"
        stroke="#e6ecf5" stroke-width="3.6" stroke-linecap="round"/>
  <!-- "i" dot. -->
  <circle cx="33" cy="7.5" r="2.8" fill="#e6ecf5"/>
</svg>
