<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="340" fill="#0B1220" rx="10"/>
  <text x="480" y="40" fill="#E2E8F0" font-size="19" font-weight="600" text-anchor="middle">From your systems to a governed model</text>

  <!-- sources -->
  <ellipse cx="88" cy="126" rx="34" ry="11" fill="#1E293B" stroke="#64748B"/>
  <path d="M54 126 v40 a34 11 0 0 0 68 0 v-40" fill="#1E293B" stroke="#64748B"/>
  <text x="88" y="200" fill="#94A3B8" font-size="12" text-anchor="middle">schema</text>
  <rect x="56" y="222" width="64" height="46" rx="4" fill="#1E293B" stroke="#64748B"/>
  <g stroke="#475569" stroke-width="1.5"><path d="M64 234h48M64 244h48M64 254h34"/></g>
  <text x="88" y="284" fill="#94A3B8" font-size="12" text-anchor="middle">logs</text>

  <!-- phases -->
  <g font-size="12.5">
    <rect x="168" y="106" width="120" height="52" rx="7" fill="#121C2E" stroke="#38BDF8"/>
    <text x="228" y="130" fill="#E2E8F0" text-anchor="middle">introspect</text>
    <text x="228" y="147" fill="#64748B" font-size="11" text-anchor="middle">--phase 1</text>

    <rect x="168" y="216" width="120" height="52" rx="7" fill="#121C2E" stroke="#38BDF8"/>
    <text x="228" y="240" fill="#E2E8F0" text-anchor="middle">mine</text>
    <text x="228" y="257" fill="#64748B" font-size="11" text-anchor="middle">--phase mine</text>

    <rect x="330" y="216" width="126" height="52" rx="7" fill="#121C2E" stroke="#FBBF24"><animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.58;0.64;0.70;1" dur="12s" repeatCount="indefinite"/></rect>
    <text x="393" y="240" fill="#FBBF24" text-anchor="middle">human review</text>
    <text x="393" y="257" fill="#64748B" font-size="11" text-anchor="middle">approve / reject</text>

    <rect x="330" y="106" width="126" height="52" rx="7" fill="#121C2E" stroke="#A3E635"/>
    <text x="393" y="130" fill="#E2E8F0" text-anchor="middle">generate</text>
    <text x="393" y="147" fill="#64748B" font-size="11" text-anchor="middle">--phase 2,3</text>

    <rect x="498" y="106" width="126" height="52" rx="7" fill="#121C2E" stroke="#A3E635"/>
    <text x="561" y="130" fill="#E2E8F0" text-anchor="middle">materialise</text>
    <text x="561" y="147" fill="#64748B" font-size="11" text-anchor="middle">--phase abox</text>

    <rect x="666" y="106" width="126" height="52" rx="7" fill="#121C2E" stroke="#A3E635"/>
    <text x="729" y="130" fill="#E2E8F0" text-anchor="middle">check</text>
    <text x="729" y="147" fill="#64748B" font-size="11" text-anchor="middle">--phase quality</text>
  </g>

  <!-- artifacts -->
  <rect x="828" y="88" width="106" height="152" rx="7" fill="#16233A" stroke="#A3E635" stroke-width="1.5"/>
  <text x="881" y="112" fill="#A3E635" font-size="11.5" text-anchor="middle" letter-spacing="1">ARTIFACTS</text>
  <g fill="#E2E8F0" font-size="11.5" text-anchor="middle">
    <text x="881" y="136">enterprise.ttl</text>
    <text x="881" y="155">events.ttl</text>
    <text x="881" y="174">provenance.ttl</text>
    <text x="881" y="193">dimensions.ttl</text>
    <text x="881" y="212">instances.ttl</text>
    <text x="881" y="231">shapes</text>
  </g>

  <g stroke="#64748B" stroke-width="1.8" fill="none" marker-end="url(#p)">
    <path d="M124 146 L164 134"/>
    <path d="M124 244 L164 244"/>
    <path d="M288 244 L326 244"/>
    <path d="M393 216 L393 162"/>
    <path d="M288 132 L326 132"/>
    <path d="M456 132 L494 132"/>
    <path d="M624 132 L662 132"/>
    <path d="M792 132 L824 140"/>
  </g>
  <text x="404" y="192" fill="#FBBF24" font-size="11">approved only</text>

  <circle r="6" fill="#38BDF8">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.44;0.48;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.16;0.34;0.56;0.78;1;1" keyTimes="0;0.08;0.16;0.26;0.36;0.44;1"
      path="M88 150 L228 132 L393 132 L561 132 L729 132 L881 150 L881 150"/>
  </circle>
  <circle r="6" fill="#FBBF24">
    <animate attributeName="opacity" values="0;0;1;1;1;0;0" keyTimes="0;0.48;0.52;0.66;0.90;0.95;1" dur="12s" repeatCount="indefinite"/>
    <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.14;0.30;0.30;0.52;0.74;0.90;1;1" keyTimes="0;0.52;0.60;0.68;0.74;0.80;0.86;0.92;1"
      path="M88 260 L228 244 L393 244 L393 244 L393 132 L561 132 L729 132 L881 150 L881 150"/>
  </circle>
  <defs><marker id="p" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748B"/></marker></defs>
</svg>
