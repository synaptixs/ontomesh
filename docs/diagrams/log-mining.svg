<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="400" fill="#0B1220" rx="10"/>
  <text x="480" y="38" fill="#E2E8F0" font-size="19" font-weight="600" text-anchor="middle">How logs become ontology candidates</text>
  <text x="480" y="60" fill="#64748B" font-size="12.5" text-anchor="middle">Statistics propose. A human decides. Nothing is written automatically.</text>

  <g font-size="12">
    <rect x="26" y="96" width="150" height="92" rx="7" fill="#121C2E" stroke="#334155"><animate attributeName="stroke" values="#334155;#334155;#38BDF8;#38BDF8;#334155;#334155" keyTimes="0;0.04;0.08;0.18;0.22;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#16233A;#16233A;#121C2E;#121C2E" keyTimes="0;0.04;0.08;0.18;0.22;1" dur="11s" repeatCount="indefinite"/></rect>
    <text x="101" y="120" fill="#38BDF8" font-size="12.5" text-anchor="middle" font-weight="600">1 &#183; templates</text>
    <text x="101" y="142" fill="#94A3B8" text-anchor="middle">400 lines</text>
    <text x="101" y="159" fill="#94A3B8" text-anchor="middle">&#8595;</text>
    <text x="101" y="176" fill="#E2E8F0" text-anchor="middle">4 shapes</text>

    <rect x="204" y="96" width="150" height="92" rx="7" fill="#121C2E" stroke="#334155"><animate attributeName="stroke" values="#334155;#334155;#38BDF8;#38BDF8;#334155;#334155" keyTimes="0;0.15;0.19;0.29;0.33;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#16233A;#16233A;#121C2E;#121C2E" keyTimes="0;0.15;0.19;0.29;0.33;1" dur="11s" repeatCount="indefinite"/></rect>
    <text x="279" y="120" fill="#38BDF8" font-size="12.5" text-anchor="middle" font-weight="600">2 &#183; slot typing</text>
    <text x="279" y="142" fill="#A3E635" text-anchor="middle">ENUM &#8594; entity</text>
    <text x="279" y="160" fill="#94A3B8" text-anchor="middle">FREETEXT &#8594; attribute</text>
    <text x="279" y="178" fill="#FBBF24" text-anchor="middle">pii_risk flag</text>

    <rect x="382" y="96" width="164" height="92" rx="7" fill="#121C2E" stroke="#334155"><animate attributeName="stroke" values="#334155;#334155;#38BDF8;#38BDF8;#334155;#334155" keyTimes="0;0.26;0.30;0.40;0.44;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#16233A;#16233A;#121C2E;#121C2E" keyTimes="0;0.26;0.30;0.40;0.44;1" dur="11s" repeatCount="indefinite"/></rect>
    <text x="464" y="120" fill="#38BDF8" font-size="12.5" text-anchor="middle" font-weight="600">3 &#183; relationships</text>
    <text x="464" y="142" fill="#94A3B8" text-anchor="middle">PMI co-occurrence</text>
    <text x="464" y="162" fill="#E2E8F0" font-size="11.5" text-anchor="middle">log&#8322; p(x,y) / p(x)p(y)</text>
    <text x="464" y="180" fill="#94A3B8" text-anchor="middle">&#964; = 2.0</text>

    <rect x="574" y="96" width="164" height="92" rx="7" fill="#121C2E" stroke="#334155"><animate attributeName="stroke" values="#334155;#334155;#38BDF8;#38BDF8;#334155;#334155" keyTimes="0;0.37;0.41;0.51;0.55;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#16233A;#16233A;#121C2E;#121C2E" keyTimes="0;0.37;0.41;0.51;0.55;1" dur="11s" repeatCount="indefinite"/></rect>
    <text x="656" y="120" fill="#38BDF8" font-size="12.5" text-anchor="middle" font-weight="600">4 &#183; direction</text>
    <text x="656" y="142" fill="#94A3B8" text-anchor="middle">lead ratio</text>
    <text x="656" y="162" fill="#E2E8F0" text-anchor="middle">directed &#183; flipped</text>
    <text x="656" y="180" fill="#FBBF24" text-anchor="middle">or left ambiguous</text>

    <rect x="766" y="96" width="168" height="92" rx="7" fill="#121C2E" stroke="#334155"><animate attributeName="stroke" values="#334155;#334155;#38BDF8;#38BDF8;#334155;#334155" keyTimes="0;0.48;0.52;0.62;0.66;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#16233A;#16233A;#121C2E;#121C2E" keyTimes="0;0.48;0.52;0.62;0.66;1" dur="11s" repeatCount="indefinite"/></rect>
    <text x="850" y="120" fill="#38BDF8" font-size="12.5" text-anchor="middle" font-weight="600">5 &#183; causality</text>
    <text x="850" y="142" fill="#94A3B8" text-anchor="middle">Granger + transfer</text>
    <text x="850" y="160" fill="#94A3B8" text-anchor="middle">entropy, triangulated</text>
    <text x="850" y="180" fill="#E2E8F0" font-size="11.5" text-anchor="middle">fails &#8594; downgraded</text>
  </g>

  <g stroke="#475569" stroke-width="1.8" fill="none" marker-end="url(#m)">
    <path d="M176 142 L200 142"/><path d="M354 142 L378 142"/>
    <path d="M546 142 L570 142"/><path d="M738 142 L762 142"/>
  </g>

  <path d="M480 188 L480 224" stroke="#FBBF24" stroke-width="2" fill="none" marker-end="url(#w)"/>

  <rect x="228" y="228" width="504" height="86" rx="8" fill="#121C2E" stroke="#FBBF24" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;1.5;3;1.5;1.5" keyTimes="0;0.62;0.70;0.78;1" dur="11s" repeatCount="indefinite"/><animate attributeName="fill" values="#121C2E;#121C2E;#231B08;#121C2E;#121C2E" keyTimes="0;0.62;0.70;0.78;1" dur="11s" repeatCount="indefinite"/></rect>
  <text x="480" y="254" fill="#FBBF24" font-size="13.5" text-anchor="middle" font-weight="600">REVIEW QUEUE &#8212; status: PENDING</text>
  <g font-size="12" fill="#E2E8F0">
    <text x="300" y="280">LOG_ENTITY</text><text x="452" y="280">LOG_EVENT</text><text x="596" y="280">LOG_RELATIONSHIP</text>
  </g>
  <text x="480" y="302" fill="#94A3B8" font-size="12" text-anchor="middle">each carries its evidence &#8212; hit counts, scores, sample lines</text>

  <path d="M480 314 L480 344" stroke="#A3E635" stroke-width="2" fill="none" marker-end="url(#o)"/>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.96;1" dur="11s" repeatCount="indefinite"/><rect x="330" y="348" width="300" height="38" rx="8" fill="#16233A" stroke="#A3E635" stroke-width="1.5"/></g>
  <text x="480" y="372" fill="#A3E635" font-size="13" text-anchor="middle" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.86;0.96;1" dur="11s" repeatCount="indefinite"/>approved &#8594; becomes ontology</text>

  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#475569"/></marker>
    <marker id="w" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#FBBF24"/></marker>
    <marker id="o" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#A3E635"/></marker>
  </defs>
</svg>
