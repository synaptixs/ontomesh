version: "3.9"

# Ontology Engineering Toolkit — Full-stack demo
# Sprint S13 · Phase 3
#
# Services:
#   toolkit      — Pipeline CLI + Browser Wizard (Flask)
#   oxigraph     — Lightweight SPARQL 1.1 endpoint (stores generated Turtle)
#   shacl        — pyshacl HTTP validation microservice
#   api-gateway  — OpenAPI / TMF URL gateway (nginx)
#
# Usage:
#   docker-compose up -d
#   open http://localhost:5000          # Browser wizard
#   open http://localhost:7878          # Oxigraph SPARQL endpoint
#   open http://localhost:8080          # API gateway (TMF URL patterns)
#
# Pre-loaded examples:
#   Telecom (enterprise.db + TMF schema)
#
# Publish ontology to Oxigraph after pipeline runs:
#   docker-compose exec toolkit python toolkit.py --phase publish \
#     --store oxigraph --endpoint http://oxigraph:7878

services:

  # ── Ontology Toolkit ──────────────────────────────────────────────────────
  toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontology-toolkit
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./db:/app/db
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - OXIGRAPH_ENDPOINT=http://oxigraph:7878
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    networks:
      - ontology-net
    depends_on:
      oxigraph:
        condition: service_healthy
    command: >
      sh -c "python toolkit.py &&
             python wizard/app.py --host 0.0.0.0 --port 5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Oxigraph SPARQL Endpoint ──────────────────────────────────────────────
  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    container_name: ontology-oxigraph
    ports:
      - "7878:7878"
    volumes:
      - oxigraph-data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    networks:
      - ontology-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/query?query=ASK%7B%7D"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── SHACL Validation Microservice ────────────────────────────────────────
  shacl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontology-shacl
    ports:
      - "5001:5001"
    volumes:
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - ontology-net
    command: python -c "
      from flask import Flask, request, jsonify;
      import pyshacl, rdflib, app as _app_shacl;
      app = Flask('shacl-service');

      @app.route('/validate', methods=['POST'])
      def validate():
          body = request.get_json(force=True);
          data_graph = rdflib.Graph().parse(data=body.get('data',''), format='turtle');
          shapes_graph = rdflib.Graph().parse(data=body.get('shapes',''), format='turtle');
          conforms, _, text = pyshacl.validate(data_graph, shacl_graph=shapes_graph);
          return jsonify({'conforms': conforms, 'report': text});

      @app.route('/health')
      def health(): return jsonify({'ok': True});

      app.run(host='0.0.0.0', port=5001)
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── API Gateway (nginx) ───────────────────────────────────────────────────
  api-gateway:
    image: nginx:alpine
    container_name: ontology-gateway
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ontology-net
    depends_on:
      - toolkit
      - oxigraph

volumes:
  oxigraph-data:
    driver: local

networks:
  ontology-net:
    driver: bridge
