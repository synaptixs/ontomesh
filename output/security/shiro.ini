[main]
# Uncomment and configure a real realm for production:
# iniRealm = org.apache.shiro.realm.text.IniRealm
# $iniRealm.userDefinitions = $users
# $iniRealm.roleDefinitions = $roles

[users]
# username = password, role1, role2
# IMPORTANT: Replace passwords before deployment
viewer = change-me-viewer, public_user
analyst = change-me-analyst, data_analyst
steward = change-me-steward, data_steward
admin = change-me-admin, ontology_admin

[roles]
# role = permission1, permission2
# Permissions use Fuseki path pattern: /dataset/graph/TIER:read
public_user = ontology:graph:Public:read
data_reader = ontology:graph:Public:read, ontology:graph:Internal:read
data_analyst = ontology:graph:Public:read, ontology:graph:Internal:read, ontology:graph:Confidential:read
data_steward = ontology:graph:Public:read, ontology:graph:Internal:read, ontology:graph:Confidential:read, ontology:graph:Restricted:read, ontology:graph:Public:write, ontology:graph:Internal:write, ontology:graph:Confidential:write, ontology:graph:Restricted:write
data_engineer = ontology:graph:Public:read, ontology:graph:Internal:read, ontology:graph:Confidential:read
ontology_admin = ontology:graph:Public:read, ontology:graph:Internal:read, ontology:graph:Confidential:read, ontology:graph:Restricted:read, ontology:graph:Public:write, ontology:graph:Internal:write, ontology:graph:Confidential:write, ontology:graph:Restricted:write

[urls]
# URL pattern → required roles
/$/ping = anon
/$/server = roles[ontology_admin]
/ontology/query = authcBasic, roles[public_user, data_reader, data_analyst, data_steward, ontology_admin]
/ontology/update = authcBasic, roles[data_steward, ontology_admin]
/ontology/upload = authcBasic, roles[ontology_admin]
/** = authcBasic
