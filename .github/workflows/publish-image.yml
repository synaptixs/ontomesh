# Build the Ontomesh wizard image and push it to the project's
# GitHub Container Registry (GHCR).  Internal-only: the repo is
# private, so the resulting image is also private.  Team-members
# pull with a personal access token that has the `read:packages`
# scope.
#
# Triggers
#   • git tag v3.6.0-dev → publishes ontomesh:3.6.0-dev + ontomesh:latest
#   • manual run (Actions tab → Run workflow) → publishes ontomesh:<branch>
#
# Multi-arch
#   amd64 (Intel/AMD servers + Windows / Linux laptops)
#   arm64 (Apple Silicon, Raspberry Pi, AWS Graviton)
#   so any teammate's docker pull "just works."
#
# What testers do (one-time setup):
#   1. Create a GitHub Personal Access Token with scope `read:packages`:
#        https://github.com/settings/tokens/new?scopes=read:packages
#   2. Log Docker into ghcr.io:
#        echo $TOKEN | docker login ghcr.io -u $YOUR_GH_USER --password-stdin
#   3. Run:
#        docker run --rm -p 5051:5051 ghcr.io/nrohilla-fibonacci/ontomesh:latest

name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"        # publishes :3.6.0-dev style tags + :latest
  workflow_dispatch:    # manual button on the Actions tab; publishes :<branch>
    inputs:
      tag:
        description: "Image tag to publish (e.g. 'preview-2026-06-04'). Leave blank to use branch name."
        required: false
        type: string

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository_owner }}/ontomesh

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN needs:
    # - packages:write to push to ghcr.io
    # - contents:read to checkout the repo
    # - id-token:write (P3.6) to mint the keyless OIDC token cosign
    #   uses for image signing
    # - security-events:write (P3.6) so Trivy results upload to the
    #   repo's "Security" tab as a SARIF report
    permissions:
      contents:         read
      packages:         write
      id-token:         write
      security-events:  write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute image tags:
      #   • For a tag push (refs/tags/v3.6.0-dev) → "3.6.0-dev" + "latest"
      #   • For a manual run → input.tag if given, else the branch name
      - name: Compute tags
        id: tags
        run: |
          set -eu
          tags=()
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            # Strip the leading 'v' so v3.6.0-dev becomes 3.6.0-dev.
            ref="${{ github.ref_name }}"
            ver="${ref#v}"
            tags+=("${REGISTRY}/${IMAGE_NAME}:${ver}")
            tags+=("${REGISTRY}/${IMAGE_NAME}:latest")
          else
            requested="${{ inputs.tag }}"
            if [ -z "$requested" ]; then
              requested="${{ github.ref_name }}"
            fi
            # Normalise: replace anything that's not [A-Za-z0-9._-] with '-'.
            safe=$(printf '%s' "$requested" | tr -c 'A-Za-z0-9._-' '-')
            tags+=("${REGISTRY}/${IMAGE_NAME}:${safe}")
          fi
          # Emit as a multi-line output for buildx.
          {
            echo "tags<<EOF"
            for t in "${tags[@]}"; do echo "$t"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Will publish:"
          printf "  %s\n" "${tags[@]}"

      - name: Build and push (with provenance + SBOM)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Layer cache between runs.
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          # P3.6 — supply-chain attestations.
          # provenance=mode=max → SLSA provenance attestation
          #   covering the entire build (sources, build env,
          #   materials, invocation params).
          # sbom=true            → SPDX SBOM attached to the image.
          # Both are stored as separate OCI artefacts that
          # `docker buildx imagetools inspect …` shows.
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Ontomesh — the ontology mesh for GraphRAG
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      # ── P3.6 — Vulnerability scan (Trivy) ──────────────────
      # Scan the published image and fail the job on HIGH or
      # CRITICAL CVEs.  Results upload to GitHub's Security tab
      # as a SARIF report so triage history is preserved.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref:        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format:           sarif
          output:           trivy-results.sarif
          severity:         CRITICAL,HIGH
          exit-code:        "1"               # fail on findings
          ignore-unfixed:   true
          vuln-type:        "os,library"
        continue-on-error: true       # don't block sign + summary — see below

      - name: Upload Trivy report to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # ── P3.6 — Sign every pushed tag (cosign, keyless OIDC) ───
      # Uses the GitHub Actions OIDC identity, so no long-lived
      # signing key has to live in repo secrets.  The signature
      # lands in ghcr.io as `<digest>.sig` and verifies against
      # the workflow's identity.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS:   ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Published images"
            echo ""
            echo "\`\`\`"
            echo "${{ steps.tags.outputs.tags }}"
            echo "\`\`\`"
            echo ""
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "**Signed** with the workflow's keyless OIDC identity."
            echo "**SBOM** + **SLSA provenance** attached as OCI artefacts."
            echo "**Vulnerability scan:** see the Security tab."
            echo ""
            echo "Verify the signature locally with:"
            echo ""
            echo "\`\`\`bash"
            echo "cosign verify ${REGISTRY}/${IMAGE_NAME}:latest \\"
            echo "  --certificate-identity-regexp=^https://github.com/${{ github.repository }} \\"
            echo "  --certificate-oidc-issuer=https://token.actions.githubusercontent.com"
            echo "\`\`\`"
            echo ""
            echo "Inspect the SBOM with:"
            echo ""
            echo "\`\`\`bash"
            echo "docker buildx imagetools inspect ${REGISTRY}/${IMAGE_NAME}:latest --format '{{ json .SBOM }}'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
