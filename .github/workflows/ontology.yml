name: Ontology CI

on:
  pull_request:
    paths:
      - "db/**.sql"
      - "src/**.py"
      - "onboard.py"
      - "toolkit.py"
      - "tests/sparql/**.sparql"
      - ".github/workflows/ontology.yml"
  push:
    branches:
      - main
      - develop
      - "phase-*"

env:
  DB_PATH: db/enterprise.db
  OUT_PATH: output

jobs:
  # ── Stage 1: Ontology generation ─────────────────────────────────────────
  generate:
    name: Generate ontology artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rdflib + owlrl (SPARQL backend, reasoner)
        run: pip install rdflib owlrl

      # One invocation, not an enumerated list. The generate job previously
      # ran a hand-listed subset of phases while the baseline was recorded
      # from `--phase all`, so CI measured a smaller corpus than the baseline
      # described and the gate failed on a difference that was not a
      # regression. `all` is the single source of truth for what a full run
      # produces; anything it omits is omitted everywhere.
      - name: Run the full pipeline
        run: python toolkit.py --phase all --db ${{ env.DB_PATH }} --out ${{ env.OUT_PATH }}

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}/
          retention-days: 7

  # ── Stage 1b: Artifact quality ratchet ───────────────────────────────────
  # Phase 0 of ONTOLOGY_ROADMAP.md. Before this gate, nothing in CI could
  # fail on a defective ontology: the SPARQL suite scored zero-row queries as
  # passes, several governance criteria were score literals, and no step
  # parsed the emitted Turtle. This compares measurable artifact properties
  # against ontology_baseline.json and fails only on regression, so existing
  # debt does not block work while new debt cannot land silently.
  artifact-gate:
    name: Ontology artifact gate
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rdflib
        run: pip install rdflib

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}

      - name: Check artifact metrics against baseline
        run: python scripts/ontology_gate.py --out ${{ env.OUT_PATH }}

      - name: Upload metrics
        if: always()
        run: python scripts/ontology_gate.py --out ${{ env.OUT_PATH }} --json > ontology-metrics.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ontology-metrics
          path: ontology-metrics.json

  # ── Stage 2: Reasoner consistency ────────────────────────────────────────
  reasoner:
    name: OWL 2 reasoner consistency check
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}

      - name: Install rdflib
        run: pip install rdflib

      - name: Install Java (required for ROBOT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download ROBOT
        run: |
          mkdir -p bin
          curl -fsSL https://github.com/ontodev/robot/releases/download/v1.9.5/robot.jar \
            -o bin/robot.jar
          printf '#!/bin/bash\nexec java -jar "$(dirname "$(readlink -f "$0")")/robot.jar" "$@"\n' \
            > bin/robot
          chmod +x bin/robot
          bin/robot --version
        continue-on-error: true

      - name: Run reasoner check
        run: python toolkit.py --phase reasoner --db ${{ env.DB_PATH }} --out ${{ env.OUT_PATH }}
        env:
          PYTHONPATH: src

      - name: Fail on unsatisfiable classes
        run: |
          if [ -f "${{ env.OUT_PATH }}/ontology/reasoner_report.md" ]; then
            if grep -q "CRITICAL" "${{ env.OUT_PATH }}/ontology/reasoner_report.md"; then
              echo "::error::Reasoner found CRITICAL issues (unsatisfiable classes). See reasoner_report.md"
              cat "${{ env.OUT_PATH }}/ontology/reasoner_report.md"
              exit 1
            fi
          fi

  # ── Stage 3: SPARQL CQ tests ─────────────────────────────────────────────
  sparql-cq:
    name: SPARQL competency question tests
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rdflib
        run: pip install rdflib

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}

      - name: Run SPARQL CQ tests
        run: python toolkit.py --phase sparql --db ${{ env.DB_PATH }} --out ${{ env.OUT_PATH }}

      # A query that ERRORs is always a defect — it is malformed or targets a
      # vocabulary that does not exist, and that is never acceptable.
      #
      # A query that FAILs (returns no rows against a TBox-only ontology) is
      # currently expected: 37 of 43 do, because the ontology has no ABox.
      # That count is tracked by the artifact-gate ratchet against
      # ontology_baseline.json so it can only go down. Hard-failing here
      # instead would leave CI red until Phase 4 lands and train everyone to
      # ignore it. See ONTOLOGY_ROADMAP.md Phase 0.
      - name: Check for query errors (hard gate)
        run: |
          csv="${{ env.OUT_PATH }}/reports/sparql_cq_test_results.csv"
          if [ -f "$csv" ]; then
            errors=$(grep -c ",ERROR," "$csv" 2>/dev/null || true)
            failed=$(grep -c ",FAIL," "$csv" 2>/dev/null || true)
            echo "SPARQL CQ: $failed failing (ratcheted), $errors errors (blocking)"
            if [ "$errors" -gt 0 ]; then
              echo "::error::$errors SPARQL CQ queries ERRORED — malformed query or missing vocabulary"
              grep ",ERROR," "$csv" || true
              exit 1
            fi
          fi

      - name: Upload CQ results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cq-results
          path: ${{ env.OUT_PATH }}/reports/sparql_cq_test_results.csv

  # ── Stage 4: Governance scorecard ────────────────────────────────────────
  governance:
    name: Governance scorecard + regression gate
    runs-on: ubuntu-latest
    needs: [reasoner, sparql-cq]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rdflib
        run: pip install rdflib

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}

      # The DB is generated (gitignored), not committed — this job runs in a
      # fresh checkout, so rebuild it from db/schema.sql + db/seed.sql before
      # the CQ tests query it. (The `generate` job gets it via `--phase 1`.)
      - name: Seed database (from db/schema.sql + db/seed.sql)
        run: python -c "from toolkit import setup_db; setup_db('${{ env.DB_PATH }}')"

      - name: Run CQ tests + governance scoring
        run: python toolkit.py --phase test --db ${{ env.DB_PATH }} --out ${{ env.OUT_PATH }}

      - name: Parse governance score
        id: score
        run: |
          csv="${{ env.OUT_PATH }}/reports/governance_scorecard.csv"
          if [ -f "$csv" ]; then
            avg=$(python3 -c "
          import csv, sys
          rows = list(csv.DictReader(open('$csv')))
          scores = [float(r['score']) for r in rows if r.get('score','').replace('.','',1).isdigit()]
          print(f'{sum(scores)/len(scores):.2f}' if scores else '0.00')
          ")
            echo "avg=$avg" >> $GITHUB_OUTPUT
            echo "Governance average: $avg / 5.0"
          fi

      - name: Enforce minimum governance threshold
        run: |
          avg="${{ steps.score.outputs.avg }}"
          python3 -c "
          avg = float('${avg}' or 0)
          if avg < 3.0:
              print(f'::error::Governance score {avg:.2f}/5.0 is below minimum threshold of 3.0')
              exit(1)
          elif avg < 4.0:
              print(f'::warning::Governance score {avg:.2f}/5.0 is below production target of 4.0')
          else:
              print(f'Governance score {avg:.2f}/5.0 — OK')
          "

      - name: Fetch main branch score for delta
        if: github.event_name == 'pull_request'
        id: main_score
        run: |
          git fetch origin main --depth=1 2>/dev/null || true
          # Attempt to get score from main branch artifact; default to 0 if unavailable
          echo "avg=0.00" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment governance delta on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const current = parseFloat('${{ steps.score.outputs.avg }}' || '0');
            const main    = parseFloat('${{ steps.main_score.outputs.avg }}' || '0');
            const delta   = current - main;
            const arrow   = delta >= 0 ? '↑' : '↓';
            const sign    = delta >= 0 ? '+' : '';
            const emoji   = current >= 4.0 ? '✅' : current >= 3.0 ? '⚠️' : '❌';

            const body = [
              '## Ontology Governance Score',
              '',
              `${emoji} **${current.toFixed(2)} / 5.0** &nbsp; (${arrow} ${sign}${delta.toFixed(2)} vs main)`,
              '',
              '| Threshold | Target | Status |',
              '|---|---|---|',
              `| ≥ 3.0 — Minimum gate | ≥ 4.0 — Production target | ${current >= 4.0 ? '✅ Production ready' : current >= 3.0 ? '⚠️ Above minimum, below target' : '❌ Below minimum'} |`,
              '',
              '_Full scorecard in `output/reports/governance_scorecard.csv`_',
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload governance scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-scorecard
          path: ${{ env.OUT_PATH }}/reports/governance_scorecard.csv

  # ── Stage 5: HTML report ─────────────────────────────────────────────────
  report:
    name: Generate HTML report
    runs-on: ubuntu-latest
    needs: governance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ontology-artifacts
          path: ${{ env.OUT_PATH }}

      - name: Download CQ results
        uses: actions/download-artifact@v4
        with:
          name: cq-results
          path: ${{ env.OUT_PATH }}/reports

      - name: Download governance scorecard
        uses: actions/download-artifact@v4
        with:
          name: governance-scorecard
          path: ${{ env.OUT_PATH }}/reports

      - name: Generate HTML report
        run: python toolkit.py --phase report --out ${{ env.OUT_PATH }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-report
          path: ${{ env.OUT_PATH }}/reports/toolkit_report.html
          retention-days: 30
