# Publish Ontomesh to PyPI on every `v*.*.*` tag.
#
# Uses PyPI **Trusted Publishing** (OIDC) — no API tokens, no secrets.
# The first run requires a one-time pypi.org configuration step:
#
#   1. Create the project on pypi.org if it doesn't exist:
#        https://pypi.org/manage/account/publishing/
#   2. Add a new "pending publisher":
#        PyPI Project Name:  ontomesh
#        Owner:              synaptixs
#        Repository name:    ontomesh
#        Workflow name:      publish-pypi.yml
#        Environment name:   pypi
#   3. Optional but recommended — add the same config on test.pypi.org
#      so we can publish release candidates to TestPyPI first.
#
# Once configured, every `v*.*.*` tag triggers this workflow and PyPI
# accepts the upload based on the matching OIDC identity.
#
# Triggers
#   • git tag v3.7.1 (or any v*.*.*) → publishes that version to PyPI
#   • manual run (Actions tab → Run workflow) → publishes to TestPyPI
#
# Build matrix
#   • One sdist + one wheel (pure Python — no C extensions).
#   • Builder: pypa/build (PEP 517).
#   • Uploader: pypa/gh-action-pypi-publish (OIDC).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publishing target"
        required:    true
        default:     "testpypi"
        type:        choice
        options:
          - testpypi
          - pypi

# OIDC needs id-token:write.  contents:read for checkout.
permissions:
  contents:  read
  id-token:  write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Stage 1: build sdist + wheel.  Lints the package metadata via twine
  # before any upload, so misconfiguration fails fast.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name:    Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so setuptools_scm-style version derivation works

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Inspect what we built
        run: |
          ls -lh dist/
          echo ""
          echo "=== twine check (PyPI long-description rendering, metadata sanity) ==="
          twine check --strict dist/*

      - name: Smoke-import the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import ontomesh; print('version:', ontomesh.__version__)"
          /tmp/smoke/bin/python -c "import ontomesh; assert ontomesh.__version__ != 'unknown'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2a: publish to PyPI on a tag push.
  # ─────────────────────────────────────────────────────────────────────
  publish-pypi:
    name:    Publish to PyPI
    needs:   build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    environment:
      name: pypi
      url:  https://pypi.org/project/ontomesh/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted Publishing — no `password` needed.
          packages-dir: dist/
          attestations: true            # PEP 740 attestations for each artefact

  # ─────────────────────────────────────────────────────────────────────
  # Stage 2b: publish to TestPyPI on a manual run.  Lets us validate the
  # full publish flow before pushing a real tag.
  # ─────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name:    Publish to TestPyPI
    needs:   build
    runs-on: ubuntu-latest
    if:      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    environment:
      name: testpypi
      url:  https://test.pypi.org/project/ontomesh/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir:   dist/
          attestations:   true
